name: CI/CD – exdev-api

on:
  push:
    branches: ["develop"]
  workflow_dispatch: {}    # permite correrlo manualmente

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image (:latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/exdevutem/exdev-api:latest

  deploy-staging:
    needs: build-and-push
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy locally on staging runner
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=/opt/exdev-api
          mkdir -p "$APP_DIR"
          cp docker-compose.yml "$APP_DIR/docker-compose.yml"
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          docker compose -f "$APP_DIR/docker-compose.yml" pull
          docker compose -f "$APP_DIR/docker-compose.yml" up -d --remove-orphans
          docker image prune -f
